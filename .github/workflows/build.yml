name: 'Build and Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage, DEB, RPM)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Bundles (AppImage, DEB, RPM)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: 'ModLang ${{ github.event.inputs.release_tag || github.ref_name }}'
          releaseBody: 'ModLang cross-platform release'
          releaseDraft: false
          prerelease: false
          args: '--bundles appimage,deb,rpm'